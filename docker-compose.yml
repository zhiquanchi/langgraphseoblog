services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: seoblog-qdrant
    ports:
      - "6333:6333" # REST（本项目 langchain-qdrant 走这个端口）
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    # 加鉴权时取消注释，并把 QDRANT_API_KEY 同步到 backend/.env
    # environment:
    #   QDRANT__SERVICE__API_KEY: change-me

volumes:
  qdrant_data:
